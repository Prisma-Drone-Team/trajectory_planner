session_name: flight
socket_name: drone
environment:
pre_window: 
windows:
- window_name: drone
  layout: tiled
  panes:
    - shell_command:
        - sleep 25
        - cd ~/dev_ws && source install/setup.bash
        - ros2 launch drone_odometry2 slam_leonardo.launch.py
    - shell_command:
        - sleep 25
        - cd ~/dev_ws && source install/setup.bash
        - ros2 run trajectory_planner offboard_control --ros-args --params-file /root/dev_ws/src/trajectory_planner/config/params.yaml
    - shell_command:
        - sleep 5
        - cd ~/dev_ws && source install/setup.bash
        - ros2 run trajectory_planner move_manager_node
    - shell_command:
        - sleep 20
        - cd ~/dev_ws && source install/setup.bash
        - ros2 topic echo /leo/drone/plan_status
